[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vox"
version = "0.1.0"
description = "Voice commentary tools for the NLHolden universe."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.10",
    "moviepy>=1.0.3,<2.0",
    "numpy>=1.24",
    "pydantic>=2.11",
]

[project.optional-dependencies]
dev = [
    "black>=26.0",
    "mypy>=1.18.2,<1.20",
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "ruff>=0.16",
]

[project.scripts]
vox = "main:main"

[tool.setuptools]
py-modules = ["cli", "main", "model", "sound_synchronizer", "vox"]
package-dir = {"" = "src"}

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["librosa", "librosa.*", "moviepy", "moviepy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
